name: Build NOCTUNE Portable EXE
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'
jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install
      - name: Build portable Windows EXE
        run: npm run dist:win
      - name: Upload portable EXE
        uses: actions/upload-artifact@v4
        with:
          name: NOCTUNE-Portable-Windows
          path: dist/NOCTUNE-Portable-*.exe
          if-no-files-found: error
