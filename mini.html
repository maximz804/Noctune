<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="referrer" content="strict-origin-when-cross-origin"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NOCTUNE Mini</title><style>
*{box-sizing:border-box}body{margin:0;background:linear-gradient(150deg,#2d1746,#100d1b 65%);font:13px 'Segoe UI',sans-serif;color:#f5edff;overflow:hidden}.head{height:44px;display:flex;align-items:center;gap:8px;padding:0 13px;-webkit-app-region:drag}.brand{font-weight:800;letter-spacing:2px;color:#d3a0ff;flex:1}.head button{border:0;background:#54316e;color:white;border-radius:9px;padding:7px 12px;cursor:pointer;-webkit-app-region:no-drag}.body{padding:0 12px}.title{font-weight:700;white-space:nowrap;text-overflow:ellipsis;overflow:hidden;font-size:14px;margin:0 0 5px}.artist{color:#bfa8d0;font-size:11px;margin-bottom:9px}#yt{width:100%;height:248px;background:#080610;border-radius:11px;overflow:hidden;border:1px solid #68408e}#yt iframe{width:100%;height:100%;border:0}.controls{display:flex;align-items:center;gap:9px;height:51px}.controls button{border:0;background:#54316e;border-radius:9px;color:#fff;padding:8px 13px;cursor:pointer}.controls button:hover{background:#8651bc}#play{background:#9657e9}#seek{flex:1;min-width:20px;accent-color:#ad72ff}.status{font-size:11px;color:#c9aadd;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
</style></head><body><div class="head"><span class="brand">♬ NOCTUNE</span><button id="restore">⤢ Open</button><button id="close">×</button></div><div class="body"><div id="title" class="title">Now playing</div><div id="artist" class="artist">Loading...</div><div id="yt"></div><div class="controls"><button id="like">♡</button><button id="play">▶</button><input type="range" id="seek" min="0" max="100" value="0"><span id="time">0:00</span></div><div class="status" id="status">YouTube player loading...</div></div>
<script>
const d=window.noctuneDesktop;let state=null,player=null,ready=false,playing=false,ytReady=false,requested=false;
const $=s=>document.querySelector(s);const clock=s=>`${Math.floor((s||0)/60)}:${String(Math.floor((s||0)%60)).padStart(2,'0')}`;
function snapshot(){let seconds=state?.seconds||0;try{if(ready&&player)seconds=player.getCurrentTime()||seconds}catch{}return {track:state?.track||null,seconds,playing,volume:state?.volume||70}}
function loadTrack(s){if(!s?.track)return;state=s;playing=!!s.playing;$('#title').textContent=s.track.title;$('#artist').textContent=s.track.artist;$('#status').textContent='Loading song...';if(ytReady)makePlayer()}
function makePlayer(){if(!state?.track||!ytReady)return;ready=false;if(player)try{player.destroy()}catch{}$('#yt').innerHTML='<div id="miniYT"></div>';player=new YT.Player('miniYT',{height:'100%',width:'100%',videoId:state.track.id,playerVars:{playsinline:1,autoplay:0,origin:location.origin,rel:0,start:Math.floor(state.seconds||0)},events:{onReady:e=>{ready=true;e.target.setVolume(state.volume||70);e.target.seekTo(state.seconds||0,true);if(state.playing)e.target.playVideo();$('#status').textContent='Ready'},onStateChange:e=>{playing=e.data===YT.PlayerState.PLAYING;$('#play').textContent=playing?'Ⅱ':'▶';if(e.data===YT.PlayerState.ENDED){playing=false;$('#status').textContent='Song ended'}},onError:e=>{$('#status').textContent='YouTube playback error '+e.data+' — try another song';ready=false},onAutoplayBlocked:()=>{$('#status').textContent='Click ▶ to start playback'}}})}
window.onYouTubeIframeAPIReady=()=>{ytReady=true;makePlayer()};let tag=document.createElement('script');tag.src='https://www.youtube.com/iframe_api';document.head.appendChild(tag);
d.onMiniTrack(loadTrack);d.onHandoffRequest(()=>d.handoff(snapshot()));d.miniReady();$('#restore').onclick=()=>{requested=true;d.restore()};$('#close').onclick=()=>{requested=true;d.miniClose()};
setInterval(()=>{if(!ready||!player)return;try{const t=player.getCurrentTime(),len=player.getDuration();$('#seek').max=len||100;$('#seek').value=t||0;$('#time').textContent=clock(t);d.miniStateUpdate(snapshot())}catch{}},600);$('#play').onclick=()=>{if(!ready)return;playing?player.pauseVideo():player.playVideo()};$('#seek').onchange=e=>{if(ready)player.seekTo(Number(e.target.value),true)};$('#like').onclick=()=>{if(state?.track)d.miniLike(state.track.id)};
</script><script>
// Preload does not expose an arbitrary event bus; handoff is handled by this dedicated callback.
</script></body></html>
