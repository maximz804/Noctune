<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NOCTUNE Mini</title><style>*{box-sizing:border-box}body{margin:0;color:#f8f0ff;font:13px 'Segoe UI',sans-serif;background:linear-gradient(110deg,#2a1642,#140e20)}header{display:flex;align-items:center;padding:9px 13px;height:37px;-webkit-app-region:drag}header b{color:#ce9dff;flex:1;letter-spacing:2px}button{border:0;border-radius:9px;background:#5c357e;color:white;padding:7px 12px;cursor:pointer;-webkit-app-region:no-drag}button:hover{background:#8c55c5}.content{display:flex;align-items:center;gap:11px;padding:8px 14px}.art{height:67px;width:67px;border-radius:9px;object-fit:cover;background:#39234e}.text{min-width:0;flex:1}.title{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.artist{color:#c7b1d9;font-size:11px;margin-top:5px}.controls{display:flex;gap:8px;align-items:center;margin-top:10px}.controls input{flex:1;min-width:0;accent-color:#ad77f4}.time{font-size:10px;color:#d1b6e7}#status{font-size:10px;color:#d1b6e7;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:5px}</style></head><body><header><b>◈ NOCTUNE</b><button id="restore">⤢ Open</button></header><div class="content"><img id="art" class="art"><div class="text"><div id="title" class="title">NOCTUNE Mini</div><div id="artist" class="artist">Audius</div><div class="controls"><button id="like">♡</button><button id="play">▶</button><input type="range" id="seek" min="0" max="100" value="0"><span class="time" id="time">0:00</span></div><div id="status">Muziek laden...</div></div></div><audio id="audio" preload="none"></audio><script>
const d=window.noctuneDesktop,$=s=>document.querySelector(s),audio=$('#audio');let state=null;const time=n=>`${Math.floor((n||0)/60)}:${String(Math.floor((n||0)%60)).padStart(2,'0')}`;function snapshot(){return {...state,seconds:audio.currentTime||state?.seconds||0,playing:!audio.paused,volume:Math.round(audio.volume*100)}}function load(s){if(!s?.track)return;state=s;$('#title').textContent=s.track.title;$('#artist').textContent=s.track.artist;$('#art').src=s.track.thumbnail||'';audio.volume=(s.volume??75)/100;audio.src='/api/stream/'+encodeURIComponent(s.track.id);audio.load();if(s.seconds)audio.addEventListener('loadedmetadata',()=>{audio.currentTime=s.seconds},{once:true});if(s.playing)audio.play().catch(e=>$('#status').textContent='Afspelen mislukt: '+e.message);$('#status').textContent='Audius · zonder reclame'}d.onMiniTrack(load);d.onHandoffRequest(()=>{const s=snapshot();audio.pause();d.handoff(s)});d.miniReady();$('#restore').onclick=()=>d.restore();$('#play').onclick=()=>{if(!state?.track)return;audio.paused?audio.play().catch(e=>$('#status').textContent=e.message):audio.pause()};$('#like').onclick=()=>{if(state?.track)d.miniLike(state.track.id)};$('#seek').oninput=e=>{if(Number.isFinite(audio.duration))audio.currentTime=+e.target.value};audio.ontimeupdate=()=>{if(Number.isFinite(audio.duration)){ $('#seek').max=audio.duration;$('#seek').value=audio.currentTime}$('#time').textContent=time(audio.currentTime);d.miniStateUpdate(snapshot())};audio.onplay=()=>$('#play').textContent='Ⅱ';audio.onpause=()=>$('#play').textContent='▶';audio.onerror=()=>$('#status').textContent='Dit nummer kan niet worden gestreamd';audio.onended=()=>{$('#status').textContent='Nummer afgelopen';$('#play').textContent='▶'};
</script></body></html>
